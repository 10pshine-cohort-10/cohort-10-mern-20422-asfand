reviews:
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    base_branches:
      - main
  path_instructions:
    - path: "server/**/*.js"
      instructions: "Check for missing error handling in async functions. Ensure all routes use the error middleware. Verify that sensitive data is not logged."
    - path: "client/**/*.jsx"
      instructions: "Check React component structure, missing prop validation, and proper cleanup in useEffect hooks."
    - path: "**/*.test.js"
      instructions: "Ensure test descriptions are clear and cover edge cases."
